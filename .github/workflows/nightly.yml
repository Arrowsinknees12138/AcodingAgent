# 夜间任务（实施设计第 24 节）：跟 PR 门禁分开，运行更慢/更重的验证，
# 不阻塞日常开发。
#
# 当前运行 Docker 安全测试和已实现的 Fake Model E2E 场景；第 23.5 节
# 剩余场景及 20 个任务的评测会随 Milestone 7/8 逐步加入。

name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18:00（北京时间凌晨 2 点）
  workflow_dispatch: {}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync --frozen

      - name: Docker security tests
        run: uv run pytest tests/security -v

      - name: Start official PyPI allowlist proxy
        run: docker compose up -d --wait pypi-proxy

      - name: Real pipeline with Fake Model
        run: uv run pytest tests/e2e -v
