# Build sandboxes have no direct Internet route. This proxy is their only egress.
# Keep the destination list intentionally narrow: official PyPI metadata and files.
http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT
acl official_pypi dstdomain .pypi.org .files.pythonhosted.org

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow official_pypi
http_access deny all

# Public PyPI does not need credentials. Never forward an accidental auth header.
request_header_access Authorization deny all
forwarded_for delete

# Cache package artifacts across runs without changing lockfile semantics.
cache_mem 256 MB
maximum_object_size 512 MB
cache_dir ufs /var/spool/squid 2048 16 256
